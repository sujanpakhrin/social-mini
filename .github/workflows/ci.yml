name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Docker Hub namespace comes from the DOCKERHUB_USERNAME secret
  SERVER_IMAGE: social-mini-server
  CLIENT_IMAGE: social-mini-client


jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: ./server
          - name: client
            context: ./client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in when we will actually push (push to main, not PRs)
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/social-mini-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VITE_API_URL is baked in at build time; only the client Dockerfile uses it
          build-args: |
            VITE_API_URL=
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Runs on the Vagrant self-hosted runner, only after images are pushed to main.
  # Never runs for pull requests (self-hosted runners must not execute untrusted PR code).
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    concurrency:
      group: social-mini-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout (for the compose file only)
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Real secrets live in /opt/social-mini/.env on the VM, never in the repo
          mkdir -p /opt/social-mini/proxy
          cp docker-compose.prod.yml /opt/social-mini/docker-compose.yml
          cp proxy/nginx.conf /opt/social-mini/proxy/nginx.conf
          cd /opt/social-mini
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose exec -T proxy nginx -s reload
          docker image prune -f
          docker compose ps

      - name: Check proxy and client
        run: |
          for i in {1..10}; do
            if curl --fail --silent --show-error --output /dev/null http://localhost/; then
              echo "Proxy and client are healthy"
              exit 0
            fi
            echo "Proxy not ready yet... attempt $i/10"
            sleep 3
          done
          echo "Proxy health check failed"
          exit 1

      - name: Check backend
        run: |
          for i in {1..10}; do
            if curl --fail --silent --show-error --output /dev/null http://localhost:5000/; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Backend not ready yet... attempt $i/10"
            sleep 3
          done
          echo "Backend failed health check"
          exit 1




