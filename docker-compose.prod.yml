# Deployed to /opt/social-mini/docker-compose.yml on the runner VM.
# /opt/social-mini/.env (never committed) must define:
#   DOCKERHUB_USERNAME, PORT, MONGO_URI, JWT_SECRET,
#   CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET,
#   CORS_ORIGINS   (comma-separated, plural, e.g. http://10.10.10.14)

services:
  proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_started
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - proxy
    restart: unless-stopped

  server:
    image: ${DOCKERHUB_USERNAME}/social-mini-server:${IMAGE_TAG:-latest}
    env_file: .env
    ports:
      - "127.0.0.1:5000:5000"   # loopback only: the runner health check can reach it, the network can't
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # TODO: copy the healthcheck block from your existing docker-compose.yml

  client:
    image: ${DOCKERHUB_USERNAME}/social-mini-client:${IMAGE_TAG:-latest}
    # no ports: only the proxy talks to it, over the Compose network
    depends_on:
      server:
        condition: service_healthy   # switch to service_healthy once the healthcheck is copied
    restart: unless-stopped