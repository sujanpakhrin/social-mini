# Deployed to /opt/social-mini/docker-compose.yml on the runner VM.
# /opt/social-mini/.env (never committed) must define:
#   DOCKERHUB_USERNAME, PORT, MONGO_URI, JWT_SECRET,
#   CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET,
#   CORS_ORIGINS   (comma-separated, plural, e.g. http://localhost:8080)

services:
  server:
    image: ${DOCKERHUB_USERNAME}/social-mini-server:${IMAGE_TAG:-latest}
    env_file: .env
    ports:
      - "5000:5000"
    restart: unless-stopped
    # TODO: copy the healthcheck block from your existing docker-compose.yml

  client:
    image: ${DOCKERHUB_USERNAME}/social-mini-client:${IMAGE_TAG:-latest}
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_started   # switch to service_healthy once the healthcheck is copied
    restart: unless-stopped