services:
  server:
    build: ./server
    env_file: ./server/.env
    environment:
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    